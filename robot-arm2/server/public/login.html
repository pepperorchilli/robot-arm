<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>登录 · 个人网站</title>
<link rel="stylesheet" href="/style.css">
<style>
  .auth-wrap { max-width: 380px; margin: 60px auto 0; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs button {
    flex: 1; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 600;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05); color: #8a8a8a;
    cursor: pointer; font-family: inherit; transition: all .15s;
  }
  .tabs button.on {
    background: rgba(255,255,255,.15); color: #ffffff;
    border-color: rgba(255,255,255,.4);
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #8a8a8a; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08);
    color: #fff; font-size: 14px; font-family: inherit; outline: none;
  }
  .field input:focus { border-color: rgba(255,255,255,.5); }
  .hint { font-size: 11.5px; color: #555555; margin-top: 5px; }
  .submit {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: #ffffff; color: #000000; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 6px; font-family: inherit; transition: opacity .15s;
  }
  .submit:hover:not(:disabled) { opacity: .85; }
  .submit:disabled { opacity: .5; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
  .msg.err { color: #bbbbbb; }
  .msg.ok { color: #ffffff; }
  .note {
    font-size: 12px; color: #555555; text-align: center;
    margin-top: 22px; line-height: 1.7;
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="brand">个人网站</a>
  <div class="links">
    <a href="/">首页</a>
    <a href="/control">机械臂</a>
    <a href="/library/">图书管理</a>
    <a href="/messages">留言板</a>
  </div>
</nav>

<div class="container auth-wrap">
  <div class="tabs">
    <button id="tab-login" class="on" onclick="switchTab('login')">登录</button>
    <button id="tab-register" onclick="switchTab('register')">注册</button>
  </div>

  <div class="c">
    <!-- 登录 -->
    <div id="form-login">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="li-username" autocomplete="username" placeholder="你的用户名">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="li-password" autocomplete="current-password" placeholder="你的密码">
      </div>
      <button class="submit" id="li-submit" onclick="doLogin()">登录</button>
    </div>

    <!-- 注册 -->
    <div id="form-register" style="display:none">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="rg-username" autocomplete="username" placeholder="3-32 位，字母数字下划线">
        <div class="hint">登录用，注册后不可修改</div>
      </div>
      <div class="field">
        <label>昵称</label>
        <input type="text" id="rg-nickname" placeholder="显示给其他人看的名字">
        <div class="hint">留言时会显示这个昵称</div>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="rg-password" autocomplete="new-password" placeholder="至少 6 位">
      </div>
      <button class="submit" id="rg-submit" onclick="doRegister()">注册并登录</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <p class="note">
    第一个注册的账号自动成为管理员<br>
    管理员可以控制机械臂、回复和删除留言
  </p>
</div>

<script src="/auth.js"></script>
<script>
  // 登录/注册成功后跳回原来的页面
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/control';

  function switchTab(which) {
    const isLogin = which === 'login';
    document.getElementById('tab-login').classList.toggle('on', isLogin);
    document.getElementById('tab-register').classList.toggle('on', !isLogin);
    document.getElementById('form-login').style.display = isLogin ? '' : 'none';
    document.getElementById('form-register').style.display = isLogin ? 'none' : '';
    showMsg('');
  }

  function showMsg(text, ok) {
    const el = document.getElementById('msg');
    el.textContent = text || '';
    el.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
  }

  async function doLogin() {
    const username = document.getElementById('li-username').value.trim();
    const password = document.getElementById('li-password').value;
    if (!username || !password) return showMsg('用户名和密码都要填');

    const btn = document.getElementById('li-submit');
    btn.disabled = true;

    const r = await api('/api/login', { username, password });
    btn.disabled = false;

    if (!r.ok) return showMsg(r.error);
    showMsg('登录成功，正在跳转…', true);
    setTimeout(() => location.href = next, 400);
  }

  async function doRegister() {
    const username = document.getElementById('rg-username').value.trim();
    const nickname = document.getElementById('rg-nickname').value.trim();
    const password = document.getElementById('rg-password').value;
    if (!username || !nickname || !password) return showMsg('三项都要填');

    const btn = document.getElementById('rg-submit');
    btn.disabled = true;

    const r = await api('/api/register', { username, password, nickname });
    btn.disabled = false;

    if (!r.ok) return showMsg(r.error);

    const role = r.data.account && r.data.account.role === 'admin';
    showMsg(role ? '注册成功，你是管理员！正在跳转…' : '注册成功，正在跳转…', true);
    setTimeout(() => location.href = next, 700);
  }

  // 回车提交
  document.getElementById('li-password').addEventListener('keyup', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('rg-password').addEventListener('keyup', e => { if (e.key === 'Enter') doRegister(); });
</script>
<script src="/starfield.js"></script>
</body>
</html>
