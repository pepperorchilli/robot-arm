<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>机械臂 · 旧版控制台</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* 这一份样式刻意和新版控制台保持一致：
     顶栏 / 状态行 / 预设按钮 / 舵机行 / 复位按钮 的尺寸与层级都对得上，
     两版之间的差别只有「轴数」和「底层固件」，界面不再有差异。 */

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 10px;
  }

  .verbar { display: flex; gap: 6px; }
  .verbar a {
    padding: 7px 14px; border-radius: 8px;
    font-size: 12.5px; font-weight: 600;
    text-decoration: none; white-space: nowrap;
    transition: all .15s;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    color: #8a8a8a;
  }
  .verbar a:hover { background: rgba(255,255,255,.1); color: #ccc; }
  .verbar a.on {
    background: rgba(255,255,255,.14);
    color: #fff;
    border-color: rgba(255,255,255,.4);
  }

  /* 状态行：在线状态 + 上一条指令，和新版一样压成一行 */
  .statusline {
    display: flex; align-items: center;
    font-size: 12.5px; color: #8a8a8a;
    margin-bottom: 10px; min-height: 18px;
  }
  .statusline .sep { margin: 0 8px; color: #444; }
  .statusline .stat {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* 预设姿态 */
  .presets {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 6px; margin-bottom: 8px;
  }
  .presets button {
    padding: 7px 0;
    border: 1px solid rgba(255,255,255,.25); border-radius: 8px;
    background: rgba(255,255,255,.08); color: #fff;
    font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .15s;
  }
  .presets button:hover { background: rgba(255,255,255,.2); }

  /* 舵机行 */
  .sl {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px; margin-bottom: 6px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
  }
  .sl .n {
    flex: 0 0 3.2em;
    font-size: 12.5px; font-weight: 600; color: #e8e8e8;
  }
  .sl input[type=range] {
    flex: 1; min-width: 0;
    -webkit-appearance: none; appearance: none;
    height: 5px; border-radius: 3px;
    background: rgba(255,255,255,.16);
    outline: none; cursor: pointer; margin: 0;
  }
  .sl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 2px solid #000; cursor: pointer;
  }
  .sl .adj {
    flex: 0 0 auto; width: 26px; padding: 4px 0;
    border: 1px solid rgba(255,255,255,.14); border-radius: 6px;
    background: rgba(255,255,255,.05); color: #bbb;
    font-size: 10.5px; cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .sl .adj:hover { background: rgba(255,255,255,.18); color: #fff; }
  .sl .v {
    flex: 0 0 2.6em; text-align: right;
    font-size: 13px; font-weight: 700; color: #fff;
    font-variant-numeric: tabular-nums;
  }

  /* 复位按钮：和新版的 .reset 一致 */
  .reset {
    width: 100%; padding: 12px; margin-top: 2px;
    border: none; border-radius: 10px;
    background: #bbb; color: #000;
    font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: opacity .15s;
  }
  .reset:hover { opacity: .85; }

  .vintage-note {
    background: rgba(255,255,255,.05);
    border-left: 2px solid rgba(255,255,255,.3);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 12.5px; color: #8a8a8a; line-height: 1.8;
    margin-top: 20px;
  }
  .vintage-note b { color: #ccc; font-weight: 600; }

  @media (max-width: 380px) {
    .sl .n { flex-basis: 2.6em; font-size: 11.5px; }
    .sl .v { flex-basis: 2.2em; font-size: 12px; }
    .sl .adj { width: 22px; font-size: 10px; }
  }
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="brand">个人网站</a>
  <div class="links">
    <a href="/">首页</a>
    <a href="/control/v1" class="on">机械臂</a>
    <a href="/library/">图书管理</a>
    <a href="/messages">留言板</a>
  </div>
</nav>

<div class="container">
  <div class="topbar">
    <div class="verbar">
      <a href="/control/v2">新版 6 轴</a>
      <a href="/control/v1" class="on">旧版 5 轴</a>
    </div>
    <div id="userbar"></div>
  </div>

  <!-- 状态行：设备在线与否 + 上一条指令 -->
  <p class="statusline">
    <span class="dot" id="dot"></span>
    <span id="onlinetext">检查中…</span>
    <span class="sep">·</span>
    <span class="stat" id="statustext">就绪</span>
  </p>

  <div class="presets" id="presets"></div>

  <div id="cards"></div>
  <button class="reset" onclick="resetAll()">全部回中</button>

  <div class="vintage-note">
    <b>第一代控制台</b> —— 项目最初的样子：MG996R 模拟舵机 + PCA9685 驱动板，
    5 个自由度，原生 JavaScript 手写界面。<br>
    操作面板已和新版统一，两代之间的差别只在轴数与底层固件。
  </div>
</div>

<script src="/auth.js"></script>
<script>
// ---------------- 第一代的轴定义（5 个自由度）----------------
const NAMES = ['底座', '大臂', '小臂', '手腕', '夹爪'];
const N = 5;
let last = [90, 90, 90, 90, 90];

// 预设姿态（5 轴版，比新版少一个腕部旋转）
const PRESETS = [
  { label: '复位', angles: [90, 90, 90, 90, 90] },
  { label: '预备', angles: [90, 120, 60, 90, 150] },
  { label: '抓取', angles: [90, 135, 45, 90, 150] },
  { label: '放下', angles: [90, 60, 120, 90, 150] },
];

// ---------------- 界面构建 ----------------

document.getElementById('presets').innerHTML = PRESETS
  .map((p, i) => '<button onclick="applyPreset(' + i + ')">' + p.label + '</button>')
  .join('');

document.getElementById('cards').innerHTML = NAMES.map((name, i) =>
  '<div class="sl">'
  + '<span class="n">' + name + '</span>'
  + '<button class="adj" onclick="adj(' + i + ',-5)">−5</button>'
  + '<button class="adj" onclick="adj(' + i + ',-1)">−1</button>'
  + '<input type="range" id="s' + i + '" min="0" max="180" value="90">'
  + '<button class="adj" onclick="adj(' + i + ',1)">+1</button>'
  + '<button class="adj" onclick="adj(' + i + ',5)">+5</button>'
  + '<span class="v" id="a' + i + '">90°</span>'
  + '</div>'
).join('');

// ---------------- 控制逻辑（沿用第一代的实现）----------------

function setStatus(text) {
  document.getElementById('statustext').textContent = text;
}

function send(i, a) {
  if (a === last[i]) return;
  last[i] = a;
  fetch('/set?servo=' + i + '&angle=' + a)
    .then(r => r.text())
    .then(t => {
      document.getElementById('a' + i).textContent = t + '°';
      setStatus(NAMES[i] + ' → ' + a + '°');
    })
    .catch(() => { setStatus('服务器无响应'); });
}

function setAngle(i, a) {
  a = Math.min(180, Math.max(0, a));
  document.getElementById('s' + i).value = a;
  document.getElementById('a' + i).textContent = a + '°';
  send(i, a);
}

function adj(i, d) {
  setAngle(i, parseInt(document.getElementById('a' + i).textContent) + d);
}

for (let i = 0; i < N; i++) {
  const s = document.getElementById('s' + i);
  s.addEventListener('input', () => { document.getElementById('a' + i).textContent = s.value + '°'; });
  s.addEventListener('change', () => send(i, +s.value));
}

// 预设姿态：逐个下发，稍微间隔一下避免瞬时并发
async function applyPreset(idx) {
  const p = PRESETS[idx];
  for (let i = 0; i < N; i++) {
    setAngle(i, p.angles[i]);
    await new Promise(r => setTimeout(r, 80));
  }
  setStatus('已应用「' + p.label + '」');
}

async function resetAll() {
  for (let i = 0; i < N; i++) {
    setAngle(i, 90);
    await new Promise(r => setTimeout(r, 80));
  }
  setStatus('全部回中 90°');
}

// ---------------- 设备状态 + 登录守卫 ----------------

async function refreshDevice() {
  const r = await api('/api/device');
  const dot = document.getElementById('dot');
  const txt = document.getElementById('onlinetext');
  if (r.ok && r.data.online) {
    dot.className = 'dot ok';
    const m = Math.floor(r.data.onlineSeconds / 60);
    txt.textContent = '在线' + (m > 0 ? ' ' + m + ' 分钟' : '');
  } else {
    dot.className = 'dot bad';
    txt.textContent = '离线';
  }
}

(async () => {
  const me = await requireLogin();
  if (!me) return;
  renderUserBar('userbar', me);
  await refreshDevice();
  setInterval(refreshDevice, 5000);
})();
</script>
<script src="/starfield.js"></script>
</body>
</html>
