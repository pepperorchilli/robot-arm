<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>机械臂 · 留言板</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="nav">
  <a href="/" class="brand">个人网站</a>
  <div class="links">
    <a href="/">首页</a>
    <a href="/control">机械臂</a>
    <a href="/library/">图书管理</a>
    <a href="/messages" class="on">留言板</a>
  </div>
</nav>
<div class="container">
  <div class="titlebar">
    <div>
      <h1>给我留言</h1>
      <p class="subtitle" id="rolehint">你的想法我都会看到</p>
    </div>
    <!-- 登录状态：昵称 + 管理员标识 + 退出 -->
    <div id="userbar"></div>
  </div>

  <div class="c">
    <!-- 昵称不用填 —— 用登录账号的昵称，防止冒名 -->
    <textarea id="content" placeholder="想说什么？" maxlength="500"></textarea>
    <button class="btn" onclick="postMsg()">发布留言</button>
  </div>

  <div id="list"></div>
  <div class="footer">留言保存在 MySQL</div>
</div>
<script src="/auth.js"></script>
<script src="/app.js"></script>
<script src="/starfield.js"></script>
</body>
</html>
